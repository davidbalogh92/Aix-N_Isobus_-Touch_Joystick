; AUX-N Touch Joystick - PlatformIO projekt
; Cél hardver (1. fázis): 2.8" ESP32-32E kijelző (E32R28T, lcdwiki / Elecrow / "CYD" család)
;   - ESP32-WROOM-32E, 4 MB flash
;   - ILI9341V (vagy E32R28T-1 változatnál ST7789) LCD, XPT2046 rezisztív érintés
;   - CAN: külső SN65HVD230 modul, TX = IO27, RX = IO35

[platformio]
default_envs = e32r28t

[env:e32r28t]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@1.1.16
build_flags =
    -DCORE_DEBUG_LEVEL=1
