; AUX-N Touch Joystick - PlatformIO projekt
; Lapok:
;   e32r35t : 3.5" ESP32-32E (E32R35T), ST7796U 320x480, XPT2046 rezisztív (közös SPI)  <- fő cél
;             CAN: SN65HVD230, TX = IO25 (I2C csatl. SCL), RX = IO35 (Expand)
;   e32r28t : 2.8" ESP32-32E (E32R28T / -1), ILI9341V vagy ST7789, XPT2046 (külön busz)
;             CAN: SN65HVD230, TX = IO27 (SPI csatl. CS), RX = IO35 (Expand)

[platformio]
default_envs = e32r35t

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@1.1.16

[env:e32r35t]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_E32R35T

[env:e32r28t]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_E32R28T
